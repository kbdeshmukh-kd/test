<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List of institutions</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h3>List of institutions</h3>
    <div id="messageBox" class="alert" style="display:none"></div>
    <div class="table-responsive">
        <table id="requestsTable" class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Headquarter</th>
                <th>Acronym</th>
                <th>Name</th>
                <th>City</th>
                <th>Country</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <a class="btn btn-info" href="/request" role="button">
        <span class="glyphicon glyphicon-plus" aria-hidden="true"></span> Add Institution
    </a>
</div>
<script src="/js/listrequest.js"></script>
</body>
</html>
